<div
  style="width: 200px; height: 200px"
  class="btn btn-pulse"
  (click)="selectOption()"
  [ngClass]="{
    neutral: isNeutral,
    correct: !isNeutral && correctOption,
    wrong: !isNeutral && !correctOption
  }"
  [ngStyle]="{ cursor: deactivated ? 'not-allowed' : 'pointer' }"
>
  <div
    style="
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    "
    class="set-info"
  >
    <div>
      <p>
        <span>{{ set.name }}</span>
      </p>
      <p>
        <span
          >Lançado em: @if(!!set && showLogo){ {{ set.released_at }}} @else{ --
          / -- / ----}
        </span>
      </p>
    </div>
    @if(showLogo){
    <div>
      <img style="width: 100px; height: 100px" [src]="set.icon_svg_uri" />
    </div>
    }
  </div>
</div>
